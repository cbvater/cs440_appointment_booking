<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Provider Home</title>
  <link rel="stylesheet" href="/css/serviceProviderHome.css">
</head>

<body>

<nav class="navbar">
  <div class="nav-left">
    <button class="nav-button" onclick="window.location='/serviceProviderHome'">My Appts</button>
    <button class="nav-button" onclick="window.location='/serviceProviderSchedAppt'">Schedule Appts</button>
    <button class="nav-button" onclick="window.location='/serviceProviderEditSlots'">Edit Available Appointment Slots</button>
    <button class="nav-button" onclick="window.location='/serviceProviderApptHistory'">Appt History</button>
  </div>

  <div class="nav-right">
    <button class="nav-button notif-button"
            onclick="window.location='/serviceProviderNotifications'"
            aria-label="Notifications">
            <span class="bell-wrap">
                <svg class="bell-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
                     fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/>
                    <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
                </svg>
                <span class="badge" th:if="${unreadCount > 0}"
                      th:text="${unreadCount > 99 ? '99+' : unreadCount}"></span>
            </span>
    </button>

    <div class="profile-wrapper">
      <button class="nav-button profile-button">Profile ▾</button>
      <div class="profile-dropdown hidden">
        <form action="/logout" method="post">
          <button type="submit" class="dropdown-item">Log Out</button>
        </form>
        <button class="dropdown-item delete">Delete Account</button>
      </div>
    </div>
  </div>
</nav>

<main>
  <h1>Notifications</h1>

  <div th:if="${#lists.isEmpty(notifications)}">
    <p>You have no notifications.</p>
  </div>

  <form th:unless="${#lists.isEmpty(notifications)}"
        th:action="@{/serviceProviderNotifications/markChecked}" method="post">
    <button type="submit" class="nav-button">Mark all as read</button>
  </form>

  <div th:each="n : ${notifications}" class="slot-card"
       th:classappend="${!n.checked} ? 'unchecked' : ''">
    <div class="slot-info">
      <p th:text="${n.message}"></p>
      <small th:text="${#temporals.format(n.createdAt, 'MMM d, yyyy h:mm a')}"></small>
    </div>
  </div>
</main>

<div id="deleteModal" class="modal hidden">
  <div class="modal-content">
    <h2>Confirm you wish to delete your account</h2>
    <div class="modal-actions">
      <button id="confirmDelete" class="modal-button delete">Yes, delete account</button>
      <button id="cancelDelete" class="modal-button">No, take me back</button>
    </div>
  </div>
</div>

<script>
  document.addEventListener("DOMContentLoaded", () => {
      const profileBtn = document.querySelector('.profile-button');
      const dropdown = document.querySelector('.profile-dropdown');
      const deleteBtn = document.querySelector('.dropdown-item.delete');
      const modal = document.getElementById('deleteModal');
      const cancelDelete = document.getElementById('cancelDelete');
      const confirmDelete = document.getElementById('confirmDelete');

      profileBtn.addEventListener('click', () => {
          dropdown.classList.toggle('hidden');
      });

      document.addEventListener('click', (e) => {
          const wrapper = document.querySelector('.profile-wrapper');
          if (!wrapper.contains(e.target)) {
              dropdown.classList.add('hidden');
          }
      });

      deleteBtn.addEventListener('click', () => {
          modal.classList.remove('hidden');
      });

      cancelDelete.addEventListener('click', () => {
          modal.classList.add('hidden');
      });

      confirmDelete.addEventListener('click', () => {
          alert("Account deletion logic goes here.");
      });
  });
</script>

</body>
</html>
